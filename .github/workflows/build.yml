name: Build Custom Villager Shops
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        run: gradle clean build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomVillagerShops-CommandShop-1.21.11
          path: build/libs/*-1.8.5-commandshop.jar
          if-no-files-found: warn
